name: LGTM Auto-Merge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lgtm-merge:
    name: Merge on /lgtm
    if: ${{ github.event.issue.pull_request && (contains(github.event.comment.body, '/lgtm') || contains(github.event.comment.body, '/LGTM')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check CODEOWNER / Collaborator Permission
        id: check-permission
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.comment.user.login;
            const association = context.payload.comment.author_association;
            
            // Allow repository owners, members, and write collaborators
            const allowedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowedRoles.includes(association)) {
              core.setFailed(`User @${author} with role ${association} is not authorized to /lgtm merge.`);
              return false;
            }
            return true;

      - name: Add Reaction to Comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Approve and Merge Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            
            // 1. Submit PR Approval Review
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: `Approved via \`/lgtm\` by @${commenter}`
              });
              console.log(`PR #${prNumber} approved successfully.`);
            } catch (err) {
              console.log(`Approval note: ${err.message}`);
            }

            // 2. Merge Pull Request
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🚀 Pull Request #${prNumber} approved and merged following \`/lgtm\` by @${commenter}.`
              });
            } catch (err) {
              core.setFailed(`Merge failed: ${err.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Could not merge PR #${prNumber}: ${err.message}\n\n*Note: Ensure GitHub Actions has "Read and write permissions" and "Allow GitHub Actions to create and approve pull requests" enabled in repository Settings > Actions > General.*`
              });
            }
